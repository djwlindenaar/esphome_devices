esphome:
  name: vloerverwarming

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  password: !secret vloerverwarming_password

ota:
  - platform: esphome
    password: !secret vloerverwarming_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Test Fallback Hotspot"
    password: !secret vloerverwarming_ap_password

captive_portal:

one_wire:
  - platform: gpio
    pin: GPIO33


# Individual sensors
sensor:
  - platform: dallas_temp
    address: 0xD52C2A871E64FF28
    name: "VV Retour Gemengd"
    accuracy_decimals: 2
    update_interval: 5s
    filters:
    - sliding_window_moving_average:
        window_size: 12
        send_every: 6

  - platform: dallas_temp
    address: 0x86F92E871E64FF28
    name: "VV Retour Hoofdgebouw"
    accuracy_decimals: 2
    update_interval: 5s
    filters:
    - offset: -0.04
    - sliding_window_moving_average:
        window_size: 12
        send_every: 6

  - platform: dallas_temp
    address: 0x5CF121871E64FF28
    name: "VV Retour Garage"
    accuracy_decimals: 2
    update_interval: 5s
    filters:
    - offset: 0
    - sliding_window_moving_average:
        window_size: 12
        send_every: 6

  - platform: dallas_temp
    address: 0x636D55871E64FF28
    name: "VV Aanvoer"
    update_interval: 5s
    accuracy_decimals: 2
    filters:
    - offset: -0.1
    - sliding_window_moving_average:
        window_size: 12
        send_every: 6

  - platform: dallas_temp
    address: 0x52513D871E64FF28
    name: "VV naar vloer"
    accuracy_decimals: 2
    update_interval: 5s
    filters:
    - sliding_window_moving_average:
        window_size: 12
        send_every: 6

